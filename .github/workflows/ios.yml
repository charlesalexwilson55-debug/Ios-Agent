name: Build unsigned iOS IPA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# contents: write is needed by the "Publish build diagnostics" step below,
# which pushes the compiler output to a branch. Downloading job logs through
# the REST API requires repository admin rights, so on a failure the errors
# are otherwise only readable by a human in the browser. Publishing them to a
# branch makes them fetchable from the public raw URL, which is what lets the
# build be debugged without handing anyone a token.
permissions:
  contents: write

jobs:
  build:
    # macos-26 is required, not merely preferred: Liquid Glass (glassEffect,
    # GlassEffectContainer) only exists in the iOS 26 SDK, which ships with
    # Xcode 26. macos-15 images top out at Xcode 16 and the build fails with
    # "cannot find glassEffect in scope". This label went generally available
    # in February 2026 and runs natively on Apple silicon, which also makes
    # the MLX Metal shader compilation considerably faster.
    runs-on: macos-26
    # MLX is a large dependency with Metal shaders to compile; the first build
    # on a cold cache is slow.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          ls /Applications | grep -i "^Xcode" || true
          sudo xcode-select -switch /Applications/Xcode_26.app/Contents/Developer \
            || echo "Xcode_26.app not found at that exact path; using image default"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install XcodeGen
        run: brew install xcodegen xcbeautify

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow for icon generation
        run: python3 -m pip install --upgrade pillow

      # Package resolution is cached separately from the build so a dependency
      # fetch failure is obvious in the log and so repeat builds skip the
      # network entirely.
      - name: Cache SwiftPM dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build IPA
        id: build
        run: |
          set -o pipefail
          mkdir -p artifacts build
          {
            xcrun swiftc -swift-version 5 -parse-as-library \
              App/Agent/ResearchPlan.swift App/Agent/ResearchEngine.swift App/Agent/Activity.swift \
              App/Web/WebSearch.swift scripts/research-tests.swift -o artifacts/research-tests \
              && artifacts/research-tests
          } 2>&1 | tee build/xcodebuild.log
          bash scripts/build-ios.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Conduit-unsigned-ipa
          path: artifacts/Conduit-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      # Uploaded separately as well as inside the IPA, because the re-signing
      # tools want it as a standalone file.
      - uses: actions/upload-artifact@v4
        with:
          name: Conduit-entitlements
          path: Support/Conduit.entitlements
          if-no-files-found: error

      # A release asset is downloadable from a plain public URL, unlike an
      # Actions artifact, which needs a signed-in browser or an API token.
      # The single "latest" release is replaced on every green build of main.
      - name: Publish IPA to the latest release
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest             artifacts/Conduit-unsigned.ipa             Support/Conduit.entitlements             --target "$GITHUB_SHA"             --prerelease             --title "Latest build (${GITHUB_SHA::7})"             --notes "Unsigned build of ${GITHUB_SHA}. Re-sign with Sideloadly using Conduit.entitlements so the increased memory limit is kept."

      # Runs last and whether the build passed or failed. Job logs need repo
      # admin rights to download through the API, so the compiler output is
      # pushed to a branch readable from a public raw URL instead.
      #
      # It works in a scratch directory and pushes from there. An earlier
      # version checked out an orphan branch inside the workspace and deleted
      # the working tree, which would have removed the IPA before a
      # successful build got to upload it.
      - name: Publish build diagnostics
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          SHA: ${{ github.sha }}
          OUTCOME: ${{ steps.build.outcome }}
        run: |
          out="$(mktemp -d)"
          {
            echo "run      #$RUN_NUMBER ($RUN_ID)"
            echo "commit   $SHA"
            echo "outcome  $OUTCOME"
            echo "xcode    $(xcodebuild -version | head -1)"
            echo "ios sdk  $(xcrun --sdk iphoneos --show-sdk-version)"
            if [ -f artifacts/Conduit-unsigned.ipa ]; then
              echo "ipa      $(stat -f%z artifacts/Conduit-unsigned.ipa) bytes"
            fi
            echo
            if [ -f build/xcodebuild.log ]; then
              # Also catches failed build commands (plugin validation, linking,
              # App Intents metadata), which emit no "error:" diagnostic.
              echo "=== errors ==="
              grep -nE "error: |ARCHIVE FAILED|BUILD FAILED|The following build commands failed|Validate plug-in|fatal error|ld: |clang: error|Undefined symbol|No such module|could not resolve|Missing package product"                 build/xcodebuild.log | sort -u -t: -k2 | head -120 || echo "(none)"
              echo
              echo "=== warnings (first 40 unique) ==="
              grep -E "warning: " build/xcodebuild.log | sed 's/^.*warning: /warning: /' | sort -u | head -40 || echo "(none)"
              echo
              echo "=== last 120 raw lines ==="
              tail -120 build/xcodebuild.log
            else
              echo "No xcodebuild.log was produced - the build failed before xcodebuild ran."
            fi
          } > "$out/diagnostics.txt"
          cat "$out/diagnostics.txt"

          cd "$out"
          git init -q
          git checkout -q -b ci-diagnostics
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics.txt
          git commit -q -m "Build diagnostics for run #$RUN_NUMBER ($OUTCOME)"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" ci-diagnostics
